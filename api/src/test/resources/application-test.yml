# Tests run against an in-memory H2 database in MySQL mode: no MySQL / Docker needed.
spring:
  datasource:
    url: jdbc:h2:mem:hangman;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  main:
    banner-mode: off

# Keep the test output short and readable in CI logs.
logging:
  level:
    root: warn
